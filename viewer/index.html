<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazada BPMN Viewer</title>
  <link rel="stylesheet" href="./public/lib/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="./public/lib/dist/assets/bpmn-js.css">
  <link rel="stylesheet" href="./public/lib/dist/assets/bpmn-font/css/bpmn-embedded.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; }
    .header { background: linear-gradient(135deg, #f57213 0%, #c2410c 100%); color: white; padding: 16px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; }
    .header-left h1 { font-size: 1.4em; margin-bottom: 2px; }
    .subtitle { opacity: 0.9; font-size: 0.85em; }
    .header-right { display: flex; gap: 8px; align-items: center; }
    .mode-badge { padding: 4px 12px; border-radius: 12px; font-size: 0.8em; font-weight: 600; background: rgba(255,255,255,0.2); }
    .mode-badge.tobe { background: #16a34a; }
    .container { display: flex; height: calc(100vh - 64px); }
    .sidebar { width: 300px; background: white; border-right: 1px solid #e2e8f0; overflow-y: auto; padding: 16px; flex-shrink: 0; }
    .sidebar h2 { font-size: 1em; color: #1e293b; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #f57213; }
    .select-label { font-size: 0.8em; color: #64748b; margin-bottom: 6px; }
    #processSelect { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95em; background: #f8fafc; color: #1e293b; cursor: pointer; margin-bottom: 14px; }
    #processSelect:focus { outline: none; border-color: #f57213; box-shadow: 0 0 0 3px rgba(245,114,19,0.15); }
    .process-meta { font-size: 0.75em; color: #64748b; margin-bottom: 12px; }
    .viewer-container { flex: 1; display: flex; flex-direction: column; background: white; min-width: 0; }
    .toolbar { padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .current-process { font-size: 1em; font-weight: 600; color: #1e293b; margin-right: auto; }
    .btn { padding: 6px 14px; background: #f57213; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85em; transition: background 0.2s; white-space: nowrap; }
    .btn:hover { background: #c2410c; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .toggle-group { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid #e2e8f0; }
    .toggle-btn { padding: 6px 14px; background: white; color: #475569; border: none; cursor: pointer; font-size: 0.85em; transition: all 0.2s; border-right: 1px solid #e2e8f0; }
    .toggle-btn:last-child { border-right: none; }
    .toggle-btn.active { background: #f57213; color: white; font-weight: 600; }
    .toggle-btn:hover:not(.active) { background: #f1f5f9; }
    #canvas { flex: 1; background: white; position: relative; overflow: hidden; }
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.1em; color: #64748b; }
    .error { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fef2f2; border: 2px solid #dc2626; padding: 16px 24px; border-radius: 8px; color: #991b1b; max-width: 500px; font-size: 0.9em; }
    .stats { padding: 10px 16px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; gap: 20px; font-size: 0.85em; flex-wrap: wrap; }
    .stat-item { display: flex; align-items: center; gap: 6px; }
    .stat-value { font-weight: 600; color: #f57213; }
    .stat-label { color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>📊 Lazada BPMN Viewer — 10 Quy trình</h1>
      <div class="subtitle">Lazada Vietnam Business Process Analysis • IE203 • AS-IS &amp; TO-BE</div>
    </div>
    <div class="header-right">
      <span class="mode-badge" id="modeBadge">AS-IS</span>
    </div>
  </div>

  <div class="container">
    <div class="sidebar">
      <h2>Quy trình nghiệp vụ</h2>
      <div class="select-label">Chọn quy trình từ danh sách:</div>
      <select id="processSelect"></select>
      <div class="process-meta" id="processMeta"></div>
    </div>

    <div class="viewer-container">
      <div class="toolbar">
        <div class="current-process" id="currentProcess">Chọn quy trình để xem</div>
        <div class="toggle-group">
          <button class="toggle-btn active" id="btnAsIs" onclick="switchVersion('asis')">AS-IS</button>
          <button class="toggle-btn" id="btnToBe" onclick="switchVersion('tobe')">TO-BE</button>
        </div>
        <button class="btn" id="zoomInBtn" style="display:none;">Zoom +</button>
        <button class="btn btn-secondary" id="zoomOutBtn" style="display:none;">Zoom −</button>
        <button class="btn btn-secondary" id="resetBtn" style="display:none;">Reset</button>
      </div>

      <div id="canvas">
        <div class="loading" id="loading">Chọn một quy trình từ danh sách để bắt đầu</div>
      </div>

      <div class="stats" id="stats" style="display:none;">
        <div class="stat-item"><span class="stat-value" id="taskCount">0</span><span class="stat-label">Tasks</span></div>
        <div class="stat-item"><span class="stat-value" id="gatewayCount">0</span><span class="stat-label">Gateways</span></div>
        <div class="stat-item"><span class="stat-value" id="flowCount">0</span><span class="stat-label">Flows</span></div>
        <div class="stat-item"><span class="stat-value" id="laneCount">0</span><span class="stat-label">Lanes</span></div>
        <div class="stat-item"><span class="stat-value" id="versionLabel">AS-IS</span><span class="stat-label">Version</span></div>
      </div>
    </div>
  </div>

  <script src="./public/lib/dist/bpmn-navigated-viewer.production.min.js"></script>
  <script>
    const processes = [
      { id: '01', name: 'Quản lý Nhà bán hàng',
        asis: { file: '../processes/01-seller-management.bpmn', tasks: 14, gateways: 15, flows: 42, lanes: 4 },
        tobe: { file: '../processes-to-be/01-seller-management.bpmn', tasks: 13, gateways: 7, flows: 29, lanes: 4 } },
      { id: '02', name: 'Quản lý Tranh chấp',
        asis: { file: '../processes/02-dispute-management.bpmn', tasks: 12, gateways: 16, flows: 38, lanes: 5 },
        tobe: { file: '../processes-to-be/02-dispute-management.bpmn', tasks: 13, gateways: 9, flows: 32, lanes: 6 } },
      { id: '03', name: 'Xử lý Đơn hàng Online ⭐',
        asis: { file: '../processes/03-order-processing.bpmn', tasks: 26, gateways: 17, flows: 56, lanes: 5 },
        tobe: { file: '../processes-to-be/03-order-processing.bpmn', tasks: 22, gateways: 9, flows: 40, lanes: 5 } },
      { id: '04', name: 'Hoàn trả & Refund ⭐',
        asis: { file: '../processes/04-return-refund.bpmn', tasks: 13, gateways: 18, flows: 43, lanes: 5 },
        tobe: { file: '../processes-to-be/04-return-refund.bpmn', tasks: 16, gateways: 9, flows: 33, lanes: 5 } },
      { id: '05', name: 'Chăm sóc Khách hàng',
        asis: { file: '../processes/05-customer-service.bpmn', tasks: 18, gateways: 11, flows: 39, lanes: 5 },
        tobe: { file: '../processes-to-be/05-customer-service.bpmn', tasks: 14, gateways: 9, flows: 31, lanes: 5 } },
      { id: '06', name: 'Marketing & Khuyến mãi',
        asis: { file: '../processes/06-marketing.bpmn', tasks: 21, gateways: 15, flows: 47, lanes: 5 },
        tobe: { file: '../processes-to-be/06-marketing.bpmn', tasks: 16, gateways: 8, flows: 31, lanes: 6 } },
      { id: '07', name: 'Quản lý Nhân sự & Đào tạo',
        asis: { file: '../processes/07-hr-training.bpmn', tasks: 17, gateways: 15, flows: 43, lanes: 4 },
        tobe: { file: '../processes-to-be/07-hr-training.bpmn', tasks: 21, gateways: 15, flows: 46, lanes: 5 } },
      { id: '08', name: 'Thanh toán & Đối soát',
        asis: { file: '../processes/08-payment-settlement.bpmn', tasks: 22, gateways: 16, flows: 49, lanes: 5 },
        tobe: { file: '../processes-to-be/08-payment-settlement.bpmn', tasks: 17, gateways: 14, flows: 41, lanes: 4 } },
      { id: '09', name: 'Logistics & Giao nhận',
        asis: { file: '../processes/09-logistics-delivery.bpmn', tasks: 20, gateways: 13, flows: 42, lanes: 5 },
        tobe: { file: '../processes-to-be/09-logistics-delivery.bpmn', tasks: 17, gateways: 19, flows: 49, lanes: 5 } },
      { id: '10', name: 'Vận hành Nền tảng Công nghệ',
        asis: { file: '../processes/10-it-platform.bpmn', tasks: 18, gateways: 16, flows: 45, lanes: 5 },
        tobe: { file: '../processes-to-be/10-it-platform.bpmn', tasks: 18, gateways: 16, flows: 45, lanes: 5 } }
    ];

    let viewer = null;
    let currentProcess = null;
    let currentVersion = 'asis';

    // Build dropdown
    const processSelect = document.getElementById('processSelect');
    processes.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      processSelect.appendChild(opt);
    });
    processSelect.addEventListener('change', () => {
      const p = processes.find(x => x.id === processSelect.value);
      if (p) loadProcess(p);
    });

    function createViewer() {
      return new BpmnJS({ container: '#canvas' });
    }

    function getVersionData(process, version) {
      return version === 'tobe' ? process.tobe : process.asis;
    }

    function setVersionUI(version) {
      document.getElementById('btnAsIs').classList.toggle('active', version === 'asis');
      document.getElementById('btnToBe').classList.toggle('active', version === 'tobe');
      const label = version === 'tobe' ? 'TO-BE' : 'AS-IS';
      document.getElementById('modeBadge').textContent = label;
      document.getElementById('modeBadge').className = 'mode-badge' + (version === 'tobe' ? ' tobe' : '');
      document.getElementById('versionLabel').textContent = label;
    }

    async function loadProcess(process) {
      currentProcess = process;
      processSelect.value = process.id;
      document.getElementById('currentProcess').textContent = process.name + ' (' + (currentVersion === 'tobe' ? 'TO-BE' : 'AS-IS') + ')';
      const vd = getVersionData(process, currentVersion);
      document.getElementById('processMeta').textContent = 'AS-IS: ' + process.asis.tasks + ' tasks • ' + process.asis.gateways + ' gateways  |  TO-BE: ' + process.tobe.tasks + ' tasks • ' + process.tobe.gateways + ' gateways';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').textContent = 'Đang tải...';
      document.getElementById('loading').className = 'loading';
      ['zoomInBtn','zoomOutBtn','resetBtn'].forEach(id => {
        document.getElementById(id).style.display = 'inline-block';
      });
      setVersionUI(currentVersion);

      try {
        const response = await fetch(vd.file);
        if (!response.ok) throw new Error('HTTP ' + response.status + ' — cần chạy qua HTTP server');
        const xml = await response.text();

        if (viewer) { viewer.destroy(); viewer = null; }
        viewer = createViewer();
        await viewer.importXML(xml);
        viewer.get('canvas').zoom('fit-viewport');

        document.getElementById('stats').style.display = 'flex';
        document.getElementById('taskCount').textContent = vd.tasks;
        document.getElementById('gatewayCount').textContent = vd.gateways;
        document.getElementById('flowCount').textContent = vd.flows;
        document.getElementById('laneCount').textContent = vd.lanes;
        document.getElementById('loading').style.display = 'none';
      } catch (err) {
        document.getElementById('loading').textContent = '⚠️ Lỗi: ' + err.message;
        document.getElementById('loading').className = 'error';
      }
    }

    function switchVersion(version) {
      if (version === currentVersion) return;
      currentVersion = version;
      if (currentProcess) loadProcess(currentProcess);
    }

    document.getElementById('zoomInBtn').addEventListener('click', () => { if (viewer) viewer.get('canvas').zoom(viewer.get('canvas').zoom() * 1.2); });
    document.getElementById('zoomOutBtn').addEventListener('click', () => { if (viewer) viewer.get('canvas').zoom(viewer.get('canvas').zoom() / 1.2); });
    document.getElementById('resetBtn').addEventListener('click', () => { if (viewer) viewer.get('canvas').zoom('fit-viewport'); });

    // Load first process
    loadProcess(processes[0]);
  </script>
</body>
</html>
